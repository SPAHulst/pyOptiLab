[project]
name = "pyoptilab"
version = "0.1.1"
description = "A personal playground for exploring combinatorial optimization problems and experimenting with algorithms in Python."
readme = "README.md"
authors = [
    { name = "SPAHulst", email = "spahulst@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "pulp>=3.3.2",
    "typer>=0.27.0",
    "pulp[cbc]>=2.929",
]

[project.scripts]
pyoptilab = "pyoptilab.main:app"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
